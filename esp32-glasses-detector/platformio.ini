; ESP32 휴대용 스마트글래스 탐지/추적기
; 빌드:   pio run -e <환경>
; 업로드: pio run -e <환경> -t upload
; 모니터: pio device monitor
;
; 추천: xiao_esp32s3 (엄지손톱 크기, 배터리 충전 회로 내장, BLE 5 확장 광고 + Coded PHY 장거리 수신)

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.1.0
    olikraus/U8g2@2.35.30

; --- Seeed XIAO ESP32S3 (추천, 휴대용) ---
; OLED: SDA=D4(GPIO5), SCL=D5(GPIO6) / 부저: D2(GPIO3) / 배터리 분압: A0(GPIO1)
; 내장 사용자 LED는 GPIO21 (LOW일 때 켜짐)
[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DOLED_SDA=5 -DOLED_SCL=6
    -DLED_PIN=21 -DLED_ACTIVE_LOW=1
    -DBUZZER_PIN=3
    -DBAT_ADC_PIN=1

; --- ESP32-S3 DevKitC ---
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DOLED_SDA=8 -DOLED_SCL=9
    -DLED_PIN=-1
    -DBUZZER_PIN=4
    -DBAT_ADC_PIN=-1

; --- ESP32-C3 SuperMini / DevKitM ---
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DOLED_SDA=8 -DOLED_SCL=9
    -DBUTTON_PIN=9
    -DLED_PIN=-1
    -DBUZZER_PIN=4
    -DBAT_ADC_PIN=-1

; --- 기본 ESP32 DevKit (BLE 4.2만 지원: 확장 광고를 쓰는 기기는 못 잡을 수 있음) ---
[env:esp32dev]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DOLED_SDA=21 -DOLED_SCL=22
    -DLED_PIN=2
    -DBUZZER_PIN=25
    -DBAT_ADC_PIN=35
