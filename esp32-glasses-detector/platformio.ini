; ESP32 휴대용 스마트글래스 탐지/추적기
; 빌드:   pio run -e <환경>
; 업로드: pio run -e <환경> -t upload
; 모니터: pio device monitor
;
; 화면 통합 보드(추천): xiao_s3_plus_114  (XIAO ESP32-S3 Plus + 1.14" 컬러 IPS, 버튼3·배터리측정 내장)
; 흑백 OLED 조립형:      xiao_esp32s3 (+ 별도 0.96" OLED)

[env]
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps = h2zero/NimBLE-Arduino@2.1.0

; ======================= 화면 통합 보드 =======================
; Seeed XIAO ESP32-S3 Plus + 1.14" IPS(ST7789 135x240). 버튼3·배터리측정 내장.
; Arduino 코어 3.x 필요 → pioarduino 플랫폼 사용.
; 핀(raw GPIO): 화면 SCLK7/MOSI9/CS3/DC4/RST13/BL12, 버튼 A43/B44/C11, 배터리 ADC10
[env:xiao_s3_plus_114]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = seeed_xiao_esp32s3
board_build.mcu = esp32s3
lib_deps =
    h2zero/NimBLE-Arduino@2.1.0
    moononournation/GFX Library for Arduino@1.5.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DDISPLAY_TFT
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTHREE_BUTTONS -DBTN_A_PIN=43 -DBTN_B_PIN=44 -DBTN_C_PIN=11
    -DBUZZER_PIN=-1        ; 이 보드는 여유핀이 적어 기본 끔(화면으로 추적).
                          ; 부저를 달면 빈 패드 GPIO로 바꾸세요(예: Grove D4/D5 중 하나 또는 D0=GPIO1)
    -DLED_PIN=-1
    -DBAT_ADC_PIN=10 -DBAT_DIVIDER=2.975
    ; 화면이 뒤집히거나 밀리면: -DTFT_ROTATION=1 또는 -DTFT_COL_OFFSET=.. 추가

; ======================= 흑백 OLED 조립형 =======================
[oled]
platform = espressif32@6.9.0
lib_deps =
    h2zero/NimBLE-Arduino@2.1.0
    olikraus/U8g2@2.35.30

; --- Seeed XIAO ESP32S3 + 0.96" OLED (휴대용) ---
[env:xiao_esp32s3]
extends = oled
board = seeed_xiao_esp32s3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DOLED_SDA=5 -DOLED_SCL=6
    -DLED_PIN=21 -DLED_ACTIVE_LOW=1
    -DBUZZER_PIN=3
    -DBAT_ADC_PIN=1

; --- ESP32-S3 DevKitC ---
[env:esp32s3]
extends = oled
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DOLED_SDA=8 -DOLED_SCL=9
    -DLED_PIN=-1
    -DBUZZER_PIN=4
    -DBAT_ADC_PIN=-1

; --- ESP32-C3 SuperMini / DevKitM ---
[env:esp32c3]
extends = oled
board = esp32-c3-devkitm-1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DOLED_SDA=8 -DOLED_SCL=9
    -DBUTTON_PIN=9
    -DLED_PIN=-1
    -DBUZZER_PIN=4
    -DBAT_ADC_PIN=-1

; --- 기본 ESP32 DevKit (BLE 4.2만: 확장 광고 기기는 못 잡을 수 있음) ---
[env:esp32dev]
extends = oled
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DOLED_SDA=21 -DOLED_SCL=22
    -DLED_PIN=2
    -DBUZZER_PIN=25
    -DBAT_ADC_PIN=35
