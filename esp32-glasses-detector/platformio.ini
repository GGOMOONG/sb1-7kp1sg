; ESP32 스마트글래스 BLE 탐지기
; 빌드:   pio run
; 업로드: pio run -t upload
; 모니터: pio device monitor

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

; ESP32-S3 / C3 보드를 쓰는 경우 아래 환경을 사용하세요: pio run -e esp32s3
[env:esp32s3]
extends = env:esp32dev
board = esp32-s3-devkitc-1

[env:esp32c3]
extends = env:esp32dev
board = esp32-c3-devkitm-1
